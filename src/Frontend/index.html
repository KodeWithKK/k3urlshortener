<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K3 URL Shortener</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon" />
    <script
      src="https://kit.fontawesome.com/85e64bd5fe.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section class="modal-alert u-hidden">
      <div class="modal-content">
        <h1>Session Expired</h1>
        <p>Your session for this account has Expired. Please Sign In Again.</p>
        <div class="btn-container">
          <div class="btn btn-secondary">Sign Out</div>
          <div class="btn btn-solid">Sign In</div>
        </div>
      </div>
    </section>
    <div class="wrapper-notification"></div>
    <nav>
      <div class="brand-logo">
        <a href="/">
          <img src="images/logo.png" alt="logo" />
          <span class="brand-name">K3 URL Shortener</span>
        </a>
      </div>
      <div class="nav-items">
        <div class="btn-toggle btn">
          <div class="bar bar-1"></div>
          <div class="bar bar-2"></div>
          <div class="bar bar-3"></div>
        </div>
        <div class="toggle-options u-hidden">
          <div class="option btn-switch-theme btn btn-icon">
            <span class="icon">
              <i class="fa-solid fa-sun"></i>
            </span>
            <span class="btn-icon-text">Light Theme</span>
          </div>
          <div class="option btn-sign-in btn btn-solid">
            <a href="/u/auth">Sign In</a>
          </div>
          <div class="option btn-logout btn btn-icon">
            <span class="icon">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </span>
            <span class="btn-icon-text">Logout</span>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <div class="wrapper-url-shortener">
        <h1>K3's URL Shortener</h1>
        <h2>Create short links that never says goodbye</h2>
        <div class="input-bar">
          <input type="text" spellcheck="false" placeholder="Enter URL Here" />
          <div class="btn-short-url btn btn-solid">Short URL</div>
        </div>
        <p class="response-message">
          <i class="fa-solid fa-circle-check"></i>&nbsp; Shortened URL
          Sucessfully Copied to the Clipboard
        </p>
      </div>

      <div class="wrapper-url-history">
        <!-- URL BAR -->
      </div>
    </main>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
